spring:
  application:
    name: notes-api
  mvc:
    problemdetails:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  sql:
    init:
      mode: always
      continue-on-error: false
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
