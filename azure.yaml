# yaml-language-server: $schema=https://aka.ms/azure-dev/v1.0/azure.yaml.json
name: springboot-postgresql
metadata:
  template: springboot-postgresql@0.0.1
requiredVersions:
  azd: "=1.35.1"
  extensions:
    azure.springboot: "=0.0.1"
infra:
  provider: bicep
  path: infra
services:
  api:
    language: java
    host: containerapp
    resourceName: ${AZURE_CONTAINER_APP_NAME}
    image: ${SPRINGBOOT_IMAGE=mcr.microsoft.com/azuredocs/containerapps-helloworld:latest}
    docker:
      imagePassthrough: true
hooks:
  preprovision:
    shell: pwsh
    run: scripts/validate-provision.ps1
  postprovision:
    shell: pwsh
    run: scripts/postprovision.ps1
  prepackage:
    shell: pwsh
    run: scripts/prepackage.ps1
  predeploy:
    shell: pwsh
    run: scripts/predeploy.ps1
  postdeploy:
    shell: pwsh
    run: scripts/postdeploy.ps1
workflows:
  up:
    - azd: provision
    - azd: deploy --all
